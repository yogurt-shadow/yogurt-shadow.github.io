# Minimalism Theme Configuration
# Docs: https://minimalism.codeover.cn/docs/start

# 基本信息
site:
  title: "Zhonghan Wang's Blog"
  subtitle: "Research Blog"
  description: "Personal research blog about formal methods and SMT solving"
  author: "Zhonghan Wang"
  language: "en"
  timezone: ""

# 网站图标
favicon: /blog/favicon.ico

# 导航栏
menu:
  Home: /
  Archives: /archives
  About: /about
  Tags: /tags

# 社交链接
social:
  GitHub: https://github.com/yogurt-shadow
  LinkedIn: https://www.linkedin.com/in/zhonghan-wang-12503a2a4/
  Google Scholar: https://scholar.google.com/citations?user=1ug9HrQAAAAJ&hl=en

# 页脚
footer:
  since: 2025
  icon:
    name: heart
    animated: true
    color: "#ff6b6b"

# 主题配置
theme:
  # 主题颜色
  color: "#2c3e50"
  
  # 代码高亮
  highlight:
    enable: true
    line_number: true
    auto_detect: true
    tab_replace: ""

# 搜索功能
search:
  enable: true
  path: search.xml
  field: post

