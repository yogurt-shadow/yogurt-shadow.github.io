# Minimalism Theme Configuration
# Docs: https://minimalism.codeover.cn/docs/start

# 基本信息
site:
  title: "Zhonghan Wang's Blog"
  subtitle: "Research Blog"
  description: "Personal research blog about formal methods and SMT solving"
  author: "Zhonghan Wang"
  language: "en"
  timezone: ""

# 网站图标
favicon: /blog/favicon.ico

# 导航栏
menu:
  Index:
    url: /
    External: false
    name: 首页
  Tags:
    url: /tags
    External: false
    name: 标签
  Archives:
    url: /archives
    External: false
    name: 归档
  About:
    url: /about
    External: false
    name: 关于

# 联系方式
contact:
  github: "https://github.com/yogurt-shadow"
  linkedin: "https://www.linkedin.com/in/zhonghan-wang-12503a2a4/"
  email: "zhece.wang@mail.utoronto.ca"

# 首页头像图片
avatar: /blog/images/avatar.png

# 深色主题
dark_theme:
  enable: true
  mode: auto

# 页脚
footer:
  since: 2025
  icon:
    name: heart
    animated: true
    color: "#ff6b6b"

# 主题配置
theme:
  # 主题颜色
  color: "#2c3e50"
  
  # 代码高亮
  highlight:
    enable: true
    line_number: true
    auto_detect: true
    tab_replace: ""

# 搜索功能
search:
  enable: true
  path: search.xml
  field: post

