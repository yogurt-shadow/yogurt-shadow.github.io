<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
    <style>
        .post-item {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            max-height: 200px;
        }
        .content {
            flex: 1;
        }
        .feature-container {
            margin-left: 16px;
            flex-shrink: 0;
            width: 240px;
            height: 135px;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <h1>Image Test</h1>
    <section class="post-item">
        <div class="content">
            <h2>Test Article</h2>
            <p>This is a test article content.</p>
        </div>
        <div class="feature-container" style="background-image: url('/blog/images/image.png');">
        </div>
    </section>
</body>
</html>
